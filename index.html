<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Semana ✨</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- Pantalla de carga -->
  <div id="pantalla-carga">
    <div class="spinner"></div>
  </div>

  <!-- Pantalla de Login / Registro -->
  <div id="pantalla-login" class="oculto">
    <div class="login-card">
      <h1>Mi Semana 🌸</h1>
      <p class="subtitulo">Organiza tu semana</p>
      <div class="login-tabs">
        <button type="button" id="tab-login" class="tab activo">Iniciar sesión</button>
        <button type="button" id="tab-registro" class="tab">Crear cuenta</button>
      </div>
      <form id="form-login">
        <input type="email" id="login-email" placeholder="Correo electrónico" required>
        <input type="password" id="login-password" placeholder="Contraseña (mín 6 carácteres)" required minlength="6">
        <p id="login-error" class="error oculto"></p>
        <button type="submit" id="btn-login-submit" class="btn-principal">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- Aplicación Principal -->
  <div id="pantalla-app" class="oculto">
    <nav class="navbar">
      <span class="logo">🌸 Semana Estética</span>
      <div class="nav-derecha">
        <span id="banner-error" class="badge-error oculto">Modo Local</span>
        <span id="usuario-email"></span>
        <button id="btn-logout" class="btn-secundario oculto" type="button">Salir</button>
      </div>
    </nav>

    <div id="mensaje-guardado" class="toast oculto">Sincronizado 💖</div>

    <main>
      <div class="controles-superiores solo-editar">
        <button id="btn-abrir-config" class="btn-secundario" type="button">⚙️ Configurar Filas y Columnas</button>
      </div>

      <!-- Contenedor Planilla Estilo Canva (Capturable) -->
      <div id="capture-area">
        <div class="vector-flor-arriba">🌸  🤍  🌸</div>
        
        <div class="titulo-planner">
          <h2>Mi Planilla Semanal</h2>
          <div class="estrellas-sub">🌸 ⋆ ˚ ⋆ ˚ 🌸</div>
        </div>

        <!-- Tabla Estilo Planilla Canva -->
        <div class="tabla-contenedor">
          <table class="tabla-horario">
            <thead id="horario-thead">
              <!-- Renderizado dinámico -->
            </thead>
            <tbody id="horario-tbody">
              <!-- Renderizado dinámico -->
            </tbody>
          </table>
        </div>

        <div class="vector-flor-abajo">✨ 🤍 ✨</div>
      </div>

      <!-- Botón de descarga ubicado fuera de la planilla para que no se superponga -->
      <div class="contenedor-btn-descarga solo-editar">
        <button id="btn-generar-imagen" class="btn-flotante" type="button">📸 Descargar Imagen HD</button>
        <button id="btn-instalar-widget" class="btn-flotante">
    📲 Instalar Widget
</button>
      </div>
    </main>
  </div>

  <!-- Modal Configuración de Filas y Columnas -->
  <div id="modal-config" class="modal-overlay oculto">
    <div class="modal">
      <h3>Estructura de la Planilla</h3>
      <p class="subtitulo">Separa los elementos usando comas (,)</p>
      
      <div class="modal-campo">
        <label for="input-cols">Columnas (Días o Categorías)</label>
        <textarea id="input-cols" rows="2" placeholder="Lunes, Martes, Miércoles..."></textarea>
      </div>
      
      <div class="modal-campo">
        <label for="input-rows">Filas (Horarios o Secciones)</label>
        <textarea id="input-rows" rows="3" placeholder="08:00, 09:00, 10:00..."></textarea>
      </div>
      
      <div class="modal-botones">
        <button type="button" id="btn-cancelar-config" class="btn-secundario">Cancelar</button>
        <button type="button" id="btn-guardar-config" class="btn-principal">Guardar Cambios</button>
      </div>
    </div>
  </div>

  <!-- Modal para Agregar Actividad -->
  <div id="modal-agregar" class="modal-overlay oculto">
    <div class="modal">
      <h3 id="modal-titulo">Nueva Actividad</h3>
      <div class="modal-campo">
        <label for="input-nota">Descripción</label>
        <input type="text" id="input-nota" placeholder="Ej: Clases, Reunión, Gym..." maxlength="40" autocomplete="off">
      </div>
      <div class="modal-campo">
        <label>Elige un ícono</label>
        <div id="selector-iconos" class="iconos-grid"></div>
      </div>
      <div class="modal-botones">
        <button type="button" id="btn-cancelar-modal" class="btn-secundario">Cancelar</button>
        <button type="button" id="btn-guardar-entrada" class="btn-principal">Añadir</button>
      </div>
    </div>
  </div>

  <!-- Modal para ver/descargar la imagen -->
  <div id="modal-imagen" class="modal-overlay oculto">
    <div class="modal modal-imagen-contenido">
      <h3>¡Tu Planilla está lista! ✨</h3>
      <img id="imagen-generada" alt="Planilla generada">
      <div class="modal-botones">
        <button type="button" id="btn-cerrar-imagen" class="btn-secundario">Volver</button>
        <a id="btn-descargar" class="btn-principal" download="mi-planilla-estetica.png">Descargar PNG</a>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
