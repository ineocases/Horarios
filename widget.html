<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Widget Visual</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff0f3; /* Fondo rosado suave que combina con tu app */
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
    }
    .widget-card {
        background: #ffffff;
        width: 100%;
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 4px 15px rgba(214, 51, 108, 0.1);
        border: 2px solid #ffb6c1;
        box-sizing: border-box;
    }
    h2 {
        color: #d6336c;
        font-size: 15px;
        margin: 0 0 12px 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .seccion-dia { margin-bottom: 12px; }
    .seccion-dia:last-child { margin-bottom: 0; }
    .titulo-dia { font-size: 11px; font-weight: bold; color: #d6336c; margin-bottom: 4px; text-transform: uppercase; }
    .dia-libre { background: #faf8f9; border: 1.5px dashed #ffb6c1; color: #b56576; text-align: center; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
    .tarea-item { background: #fff2f4; border-left: 3px solid #ff4d6d; padding: 8px 10px; border-radius: 10px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .estado-vacio { text-align: center; color: #888; font-size: 13px; padding: 10px 0; }
</style>
<body>

    <div class="widget-card">
        <h2>✨ Tu Horario</h2>
        <div id="contenedor-visual">
            <div class="estado-vacio">Cargando diseño...</div>
        </div>
    </div>

    <script type="module" src="widget.js"></script>
</body>
</html>
